# client-build/bootstrapper - the small Windows download stub ("ShaavirDriveSetup.exe"), D-160.
# Tenant values (product name, update host, manifest key, MSI upgrade code) come from oem.json at build
# time (build.rs); nothing tenant-specific lives in the code.
[package]
name = "sdrive-setup"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "sdrive_setup"
path = "src/lib.rs"

[[bin]]
name = "setup"
path = "src/main.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json = "1"
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
